<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overhead</title>
<style>
  /* ---- e-ink: pure black on white, single-weight strokes, no fills ---- */
  :root{--ink:#000;--mid:#555;--faint:#999;--u:min(1vw,1.6667vh)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#fff;color:var(--ink);overflow:hidden}
  body{font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;
       padding:calc(var(--u)*3) calc(var(--u)*4)}
  .mono{font-family:"Courier New",Courier,monospace;letter-spacing:.04em}
  .kicker{font-family:Helvetica,Arial,sans-serif;font-size:calc(var(--u)*1.45);letter-spacing:.26em;
          text-transform:uppercase;color:var(--mid)}
  header{display:flex;justify-content:space-between;align-items:baseline;
         border-bottom:1px solid var(--ink);padding-bottom:calc(var(--u)*.8)}
  header h1{font-weight:normal;font-style:italic;font-size:calc(var(--u)*3.4)}
  main{flex:1;display:grid;grid-template-columns:1fr;grid-template-rows:1.6fr 1fr 1fr;
       gap:calc(var(--u)*1.6) calc(var(--u)*4);min-height:0;padding:calc(var(--u)*1.6) 0}
  .card{display:flex;align-items:center;gap:calc(var(--u)*2.5);min-height:0;min-width:0}
  .card.feat{grid-column:1 / -1;border-bottom:1px dotted var(--faint);padding-bottom:calc(var(--u)*1.2)}
  .card svg.plane{flex:1.5 1 0;min-width:0;height:100%;max-height:100%}
  .card .info{flex:1 1 0;min-width:0}
  .card:not(.feat){gap:calc(var(--u)*2.5);border-bottom:1px dotted var(--faint);padding-bottom:calc(var(--u)*1)}
  .card:not(.feat):last-child{border-bottom:none}
  .card:not(.feat) svg.plane{flex:1.5 1 0}
  .card{overflow:hidden}
  .feat .stats{flex-wrap:nowrap;gap:0 calc(var(--u)*1.8)}
  .v{white-space:nowrap}
  .card.flip{flex-direction:row-reverse}
  .card.flip .info{text-align:right}
  .card.flip .stats{justify-content:flex-end}
  .card .info>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .info>.stats{white-space:normal}
  .call .reg{font-size:.5em;color:var(--mid)}
  .more{grid-column:1/-1;font-size:calc(var(--u)*1.6);color:var(--mid);border-top:1px solid var(--ink);padding-top:calc(var(--u)*.8);line-height:1.5;overflow:hidden}
  .more b{font-weight:normal;color:var(--ink)}

  .call{font-size:calc(var(--u)*3.2);line-height:1.05}
  .feat .call{font-size:calc(var(--u)*5.6)}
  .desc{font-style:italic;color:var(--mid);font-size:calc(var(--u)*1.9);margin-top:calc(var(--u)*.3)}
  .feat .desc{font-size:calc(var(--u)*2.3)}
  .desc .carrier{font-style:normal;color:var(--ink);font-size:1em}
  .stats{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.4) calc(var(--u)*2.6);margin-top:calc(var(--u)*1)}
  .v{font-size:calc(var(--u)*2.2)} .feat .v{font-size:calc(var(--u)*2.6)}
  .card.feat .info{flex:1.2 1 0}
  .k{font-family:Helvetica,Arial,sans-serif;font-size:calc(var(--u)*1.1);letter-spacing:.2em;text-transform:uppercase;color:var(--mid)}
  .carrier{font-size:calc(var(--u)*2);margin-top:calc(var(--u)*.5)} .feat .carrier{font-size:calc(var(--u)*2.5)}
  .quiet{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
         font-style:italic;font-size:calc(var(--u)*3.6);color:var(--mid);gap:calc(var(--u)*1)}
  .quiet small{font-style:normal}
  .photo{float:right;margin:0 0 calc(var(--u)*1) calc(var(--u)*2);width:calc(var(--u)*20);position:relative;z-index:2;background:#fff}
  .photo img{display:block;width:100%;height:auto;border:1px solid var(--ink)}
  .photo figcaption{font-family:Helvetica,Arial,sans-serif;font-size:calc(var(--u)*1.05);color:var(--mid);margin-top:calc(var(--u)*.3)}
  .photo a{color:inherit}
  #health{color:#b00} #health:not(:empty){margin-right:1.2em}
  #sndhint{position:fixed;right:calc(var(--u)*1.5);bottom:calc(var(--u)*7);font-size:calc(var(--u)*1.5);padding:.5em .9em;
    background:#fff;color:#000;border:1px solid #000;border-radius:2em;cursor:pointer;z-index:9}
  #main.heatv{display:block}
  .heat{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1)}
  .heat svg{width:min(100%,calc(var(--u)*62));height:auto}
  .heat .dots circle{fill:#000}
  .heat .ring{fill:none;stroke:#888;stroke-width:1;stroke-dasharray:3 6}
  .heat text{font:16px Helvetica,Arial,sans-serif;fill:#666}
  .heat .home{fill:#fff;stroke:#000;stroke-width:3}
  .st-rate{margin-top:calc(var(--u)*2)} .st-rate svg{width:100%;height:calc(var(--u)*5);display:block;margin-top:calc(var(--u)*.6)}
  footer{display:flex;justify-content:space-between;border-top:1px solid var(--ink);
         padding-top:calc(var(--u)*.8);font-size:calc(var(--u)*1.45);color:var(--mid)}
  svg.plane path,svg.plane circle{fill:none;stroke:#000;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-width:1.6px}
  svg.plane .dt{stroke-width:1px}
  svg.plane path.tr{fill:#000;stroke:none;fill-rule:evenodd}svg.plane path.bg{fill:#fff;stroke:none}svg.plane:not(.big) path.tr{stroke:#000;stroke-width:.5px}
  svg.plane .win{stroke-width:2.2px;stroke-dasharray:.1 4.5}
  svg.plane .gnd{stroke:#bbb;stroke-width:1px;stroke-dasharray:2 4}
  svg.plane.big path,svg.plane.big circle{stroke-width:2.2px}
  svg.plane.big .dt{stroke-width:1.3px}
  svg.plane.big .win{stroke-width:3px;stroke-dasharray:.1 6}
  svg.emb{width:1.3em;height:1.3em;fill:none;stroke:#000;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;vertical-align:-.25em;margin-right:.4em}
  .card.feat{position:relative}
  .card.feat>*:not(.map){position:relative;z-index:1}
  svg.map{position:absolute;top:0;left:0;width:60%;height:100%;z-index:0;pointer-events:none}
  svg.map path,svg.map circle{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
  svg.map .m-road,svg.map .m-water{stroke:#e2e2e2;stroke-width:.8px}
  svg.map .m-major,svg.map .m-coast{stroke:#d4d4d4;stroke-width:1px}
  svg.map .m-outline{stroke:#c8c8c8;stroke-width:1px;stroke-dasharray:6 3}
  svg.map .m-border{stroke:#e0e0e0;stroke-width:.8px;stroke-dasharray:5 3 1 3}
  svg.map .m-rwy{stroke:#d0d0d0;stroke-width:2.5px;stroke-linecap:butt}
  svg.map .m-ring{stroke:#c8c8c8;stroke-width:1px;stroke-dasharray:3 4}
  svg.map .m-tick{stroke:#c8c8c8;stroke-width:1px}
  svg.map .m-home{fill:#000;stroke:#fff;stroke-width:2px;paint-order:stroke}
  svg.map .m-dash{stroke:#000;stroke-width:1.4px;stroke-dasharray:1.5 3}
  svg.map path.m-ac{fill:#000;stroke:#fff;stroke-width:3px;stroke-linejoin:round;paint-order:stroke}
  .card.feat>*:not(.map){text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 4px #fff,0 0 6px #fff}
  .card.feat svg.plane path,.card.feat svg.plane circle{stroke-width:1.9px}
  main.week{grid-template-rows:1.4fr 1fr 1fr}
  main.week.has-more{grid-template-rows:1.4fr 1fr 1fr auto}
  @media (orientation:portrait){
    :root{--u:min(1.25vw,1vh)}
    main,main.week{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr}
    main.week.has-more{grid-template-rows:auto 1fr 1fr auto}
    .card.feat{flex-direction:column;align-items:stretch}
    svg.map{width:100%}
    .card.feat svg.plane{flex:none;width:100%;height:auto;max-height:26vh;aspect-ratio:200/74}
    .card:not(.feat):not(.flip){flex-direction:row;align-items:center}
    .card:not(.feat) svg.plane{height:100%;flex:1.3 1 0}
  }
  @media (max-height:600px){ .k{display:none} .stats{gap:0 calc(var(--u)*2)} .more{display:none} main.week.has-more{grid-template-rows:1.6fr 1fr 1fr} .hdg{display:none} .feat .call{font-size:calc(var(--u)*4.4)} .feat .desc,.feat .carrier{font-size:calc(var(--u)*2.1)} .feat .v{font-size:calc(var(--u)*2.5)} main{padding:calc(var(--u)*1) 0} main.week .card:not(.feat) .carrier{display:none} }
  /* ---- recently seen strip (hidden when empty) ---- */
  #recent{display:none;border-top:1px solid var(--ink);padding:calc(var(--u)*.7) 0;font-size:calc(var(--u)*1.55);
          color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  #recent.on{display:block}
  #recent b{font-weight:normal;color:var(--ink)} #recent .kicker{margin-right:calc(var(--u)*1)}
  #recent .sep{margin:0 calc(var(--u)*.9)}
  @media (orientation:portrait){ #recent{white-space:normal;display:none;max-height:3em} #recent.on{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical} }
  @media (max-height:600px){ #recent{font-size:calc(var(--u)*1.35);padding:calc(var(--u)*.4) 0} }
  /* ---- ?eink=1: strict 1-bit black/white, no greys, no motion ---- */
  body.eink{--mid:#000;--faint:#000}
  body.eink *{animation:none!important;transition:none!important}
  body.eink .kicker,body.eink .k,body.eink .desc,body.eink footer,body.eink #recent{color:#000}
  body.eink .card.feat,body.eink .card:not(.feat){border-bottom-style:solid}
  body.eink svg.plane .gnd{stroke:#000;stroke-dasharray:1 5}
  body.eink svg.plane path,body.eink svg.plane circle{stroke-width:2px}
  body.eink svg.plane.big path,body.eink svg.plane.big circle{stroke-width:2.8px}
  body.eink svg.map path,body.eink svg.map circle{stroke:#000!important;stroke-width:.5px!important}
  body.eink svg.map .m-road,body.eink svg.map .m-water,body.eink svg.map .m-border,body.eink svg.map .m-ring,body.eink svg.map .m-outline,body.eink svg.map .m-tick{stroke-dasharray:1 7!important}
  body.eink svg.map .m-major,body.eink svg.map .m-coast{stroke-dasharray:1 4!important}
  body.eink svg.map .m-dash{stroke-width:1.4px!important;stroke-dasharray:2 3!important}
  body.eink svg.map path.m-ac{stroke:#fff!important;stroke-width:3px!important}
  body.eink .card.feat>*:not(.map){text-shadow:none}
  body.eink svg.map .m-rwy{stroke-width:2px!important;stroke-dasharray:none!important}
  body.eink svg.map .m-home,body.eink svg.map path.m-ac{fill:#000}
  body.eink .call .reg{color:#000}
  /* ---- night mode (red on black) ---- */
  html.night{background:#000}
  html.night body{filter:invert(1) sepia(1) saturate(12) hue-rotate(-38deg) brightness(.6)}
  /* ---- stats view ---- */
  .route{font-style:normal;letter-spacing:.06em}
  .st-grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*3);padding:calc(var(--u)*3) 0;border-bottom:1px dashed var(--faint)}
  .st-col .stats{flex-direction:column;align-items:flex-start;gap:calc(var(--u)*1.5)}
  .st-types{padding-top:calc(var(--u)*2)}
  .st-row{display:grid;grid-template-columns:9em 1fr 3em;align-items:center;gap:1em;font-size:calc(var(--u)*2);margin:calc(var(--u)*.7) 0}
  .st-row i{display:block;height:calc(var(--u)*.9);background:var(--ink,#000)}
  .st-row b{text-align:right;font-weight:400}
  html.night body.eink{filter:none}
</style>
</head>
<body>
<header><h1>Overhead</h1><span class="kicker" id="where">ADS-B · live</span></header>
<main id="main"></main>
<div id="recent" class="mono" aria-live="polite"></div>
<footer class="mono"><span id="count"></span><span><span id="health"></span><span id="updated"></span></span></footer>

<script>
/* ================= CONFIG ================= */
const AIRCRAFT_URL  = 'data/aircraft.json';
const RECEIVER_URL  = AIRCRAFT_URL.replace(/aircraft\.json$/, 'receiver.json');
const INTERESTING_URL = AIRCRAFT_URL.replace(/aircraft\.json$/, 'interesting.json');   // optional, written by pi/interesting_logger.py
const HIGH_FT       = +new URLSearchParams(location.search).get('upHighFt') || 18000;   // "Up high" threshold, override with ?upHighFt=
const MAX_SEEN_S    = 60;      // ignore stale contacts
const HOME          = null;    // optional {lat,lon} override if receiver.json lacks one
/* Optional setup without editing code: define window.OVERHEAD_CONFIG in a <script> before this one
   (or a config.js), and/or use URL params. Precedence: URL param > OVERHEAD_CONFIG > constants above.
   { aircraftUrl, receiverUrl, interestingUrl, home:{lat,lon}|null, units:'aero'|'imperial'|'metric',
     eink:false, refresh:0, recent:true } */
const CFG = (function(){
  const q=new URLSearchParams(location.search), w=(typeof window!=='undefined'&&window.OVERHEAD_CONFIG)||{};
  const pick=(k,d)=>q.get(k)!=null&&q.get(k)!==''?q.get(k):(w[k]!=null?w[k]:d), bool=v=>v===true||/^(1|true|yes|on)$/i.test(String(v));
  let home=w.home||HOME||null;
  if(q.get('lat')!=null&&q.get('lon')!=null&&isFinite(+q.get('lat'))&&isFinite(+q.get('lon'))) home={lat:+q.get('lat'),lon:+q.get('lon')};
  if(home&&!(isFinite(home.lat)&&isFinite(home.lon))) home=null;
  const units=String(pick('units','aero')).toLowerCase();
  const eink=bool(pick('eink',false));
  return { aircraftUrl:q.get('url')||w.aircraftUrl||AIRCRAFT_URL,
    receiverUrl:q.get('receiver')||w.receiverUrl||null, interestingUrl:q.get('interesting')||w.interestingUrl||null,
    home, units:['aero','imperial','metric'].includes(units)?units:'aero', eink,
    refresh:+pick('refresh', eink?60:0)||0, recent:!/^(0|false|off|no)$/i.test(String(pick('recent',true))) };
})();

function shapeFor(a){

const JETS = new Set(['bizjet','regional','airliner','widebody']);
/* Carriers: ICAO prefix -> [name, emblem]. Emblems are original minimal sketches, not logos. */
const EMB = {

  arrow:'<path d="M3 16 L16 16 M11 11 L16 16 L11 21 M6 7 H21"/>',
  fin:'<path d="M5 20 L10 4 L19 4 L14 20 Z"/>',
};
const CARRIERS = {
  SWA:['Southwest','heart'], AAL:['American','eagle'], DAL:['Delta','tri'], UAL:['United','globe'],
  JBU:['JetBlue','sq'], ASA:['Alaska','fin'], NKS:['Spirit','star'], FFT:['Frontier','animal'],
  SKW:['SkyWest','wave'], RPA:['Republic','fin'], ENY:['Envoy','eagle'], EDV:['Endeavor','tri'],
  JIA:['PSA','eagle'], FDX:['FedEx','arrow'], UPS:['UPS','box'], GTI:['Atlas','globe'],
  AAY:['Allegiant','sun'], HAL:['Hawaiian','sun'], SCX:['Sun Country','sun'], BRX:['Breeze','wave'],
  MXY:['Breeze','wave'], ACA:['Air Canada','fin'], JZA:['Jazz','fin'], AWI:['Air Wisconsin','fin'],
  PDT:['Piedmont','eagle'], GJS:['GoJet','globe'], QXE:['Horizon','fin'], ABX:['ABX Air','box'],
  BAW:['British Airways','fin'], DLH:['Lufthansa','fin'], AFR:['Air France','fin'], VIR:['Virgin Atlantic','fin'],
  EJA:['NetJets','fin'], LXJ:['Flexjet','fin'], KAL:['Korean Air','fin'], UAE:['Emirates','fin'],

function carrierFor(a){
  const f=(a.flight||'').trim().toUpperCase(), m=f.match(/^([A-Z]{3})\d/);
  if(m && CARRIERS[m[1]]) return {name:CARRIERS[m[1]][0], emb:CARRIERS[m[1]][1]};
  if(a.ownOp) return {name:String(a.ownOp).trim(), emb:null};
  return null;
}
const emblem = k => k ? `<svg class="emb" viewBox="0 0 24 24">${EMB[k]}</svg>` : '';

function svg(a,{big=false}={}){
  const tr=a.track ?? a.true_heading ?? 0, west=((tr%360)+360)%360>=180;
  const k=shapeFor(a);
  const rate=a.baro_rate ?? a.geom_rate ?? 0, tilt=Math.max(-7,Math.min(7,rate/300));
  return `<svg class="plane${big?' big':''}" viewBox="0 -2 200 74" preserveAspectRatio="xMidYMid meet">
    <path class="gnd" d="M0 70 L200 70"/>
    <g transform="${west?'matrix(-1 0 0 1 200 0) ':''}rotate(${(-tilt).toFixed(1)} 100 45)${SCALE[k]?` translate(100 70) scale(${SCALE[k]}) translate(-100 -70)`:''}">${SHAPES[k]}</g></svg>`;

/* ---------- helpers ---------- */
const alt = a => typeof a.alt_baro==='number' ? a.alt_baro : (typeof a.alt_geom==='number'?a.alt_geom:NaN);
const call = a => (a.flight||'').trim() || (a.r||'').trim() || ('#'+(a.hex||'??????').toUpperCase());
const fmt = n => Math.round(n).toLocaleString('en-US');
const U={aero:{s:1,su:'kt',d:1,du:'nm'},imperial:{s:1.150779,su:'mph',d:1.150779,du:'mi'},metric:{s:1.852,su:'km/h',d:1.852,du:'km'}}[CFG.units];
function fl(ft){
  if(!isFinite(ft)) return '—';
  if(CFG.units==='metric') return fmt(ft*0.3048)+' m';
  return CFG.units==='aero'&&ft>=HIGH_FT ? 'FL'+String(Math.round(ft/100)).padStart(3,'0') : fmt(ft)+' ft'; }
const spd = kt => fmt(kt*U.s)+' '+U.su;               // input knots
const dist = n => (n*U.d).toFixed(1)+' '+U.du;        // input nautical miles
function nm(home,a){
  if(!home||a.lat==null||a.lon==null) return NaN;
  const R=3440.065,r=x=>x*Math.PI/180,dLa=r(a.lat-home.lat),dLo=r(a.lon-home.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(home.lat))*Math.cos(r(a.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));

function compass(d){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(((d%360)+360)%360/45)%8];}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- faint location map behind the featured plane ----------
   Geometry: OpenStreetMap via Overpass API (ODbL, "© OpenStreetMap contributors"),
   fetched once per location and cached in localStorage. No map if offline/blocked.
   Params: ?map=0 off, ?mapNm=25 radius, ?lat=&lon= home fallback, ?overpass=<endpoint> */
const QS=new URLSearchParams(location.search);
const MAP_ON=QS.get('map')!=='0', MAP_NM=+QS.get('mapNm')||25;
const OVERPASS=QS.get('overpass')||'https://overpass-api.de/api/interpreter';
let MAPDATA=null, LAST=null, OUTLINE=null;
const OVERPASS_ALT=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
/* readsb writes data/outline.json (actual reception range) on a stock tar1090 Pi when lat/lon are set. */
function parseOutline(j){
  const a=j&&j.actualRange, pts=(a&&((a.last24h&&a.last24h.points)||(a.alltime&&a.alltime.points)))||(j&&j.points)||null;
  return Array.isArray(pts)?pts.filter(p=>Array.isArray(p)&&isFinite(p[0])&&isFinite(p[1])).map(p=>[+p[0],+p[1]]):null;
}
/* No position anywhere: estimate one from the aircraft in view (median), so rings/outline still draw. */
function estHome(list){
  const la=[],lo=[]; for(const a of list||[]) if(a.lat!=null&&a.lon!=null&&(a.seen_pos==null||a.seen_pos<60)){la.push(+a.lat);lo.push(+a.lon);}
  if(la.length<2) return null; const med=v=>{v.sort((x,y)=>x-y);return v[v.length>>1];};
  return {lat:med(la),lon:med(lo),est:true};
}
const toXY=(h,lat,lon)=>[(lon-h.lon)*60*Math.cos(h.lat*Math.PI/180), -(lat-h.lat)*60];
function mapLayer(h,a){
  if(!h || !MAP_ON) return '';
  const R=MAP_NM; let g='';
  if(MAPDATA) for(const w of MAPDATA.w){
    const d='M'+w.p.map(([la,lo])=>toXY(h,la,lo).map(v=>v.toFixed(2)).join(' ')).join('L');
    g+=`<path class="m-${w.k}" d="${d}"/>`;
  }
  if(OUTLINE&&OUTLINE.length>2) g+=`<path class="m-outline" d="M${OUTLINE.map(([la,lo])=>toXY(h,la,lo).map(v=>v.toFixed(2)).join(' ')).join('L')}Z"/>`;
  const k=R*.06; g+=`<path class="m-tick" d="M0 ${-R*.8-k}V${-R*.8+k}M0 ${R*.8-k}V${R*.8+k}M${-R*.8-k} 0H${-R*.8+k}M${R*.8-k} 0H${R*.8+k}"/>`;
  g+=`<circle class="m-ring" r="${R*.4}"/><circle class="m-ring" r="${R*.8}"/><circle class="m-home" r="${R*.012}"/>`;
  if(a && a.lat!=null && a.lon!=null){
    let [x,y]=toXY(h,a.lat,a.lon); const d=Math.hypot(x,y), lim=R*.92;
    if(d>lim){ x*=lim/d; y*=lim/d; }
    const s=R*.05, t=(a.track||0);
    g+=`<path class="m-dash" d="M0 0 L${x.toFixed(2)} ${y.toFixed(2)}"/>`+
       `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${t})"><path class="m-ac" d="M0 ${-s*1.4} L${s} ${s} L0 ${s*.4} L${-s} ${s} Z"/></g>`;
  }
  return `<svg class="map" viewBox="${-R} ${-R} ${2*R} ${2*R}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${g}</svg>`;
}
function simplify(p,tol){ // drop points closer than tol (deg) to the previous kept point
  const o=[p[0]]; for(let i=1;i<p.length;i++){ const q=o[o.length-1];
    if(i===p.length-1 || Math.abs(p[i][0]-q[0])+Math.abs(p[i][1]-q[1])>tol) o.push(p[i]); } return o;
}
async function loadMap(h){
  if(!h || !MAP_ON || !window.fetch) return null;
  const key=`ovmap:v2:${h.lat.toFixed(2)},${h.lon.toFixed(2)}:${MAP_NM}`;
  try{ const c=localStorage.getItem(key); if(c){ const m=JSON.parse(c); if(m&&m.w&&m.w.length) return m; } }catch(e){}
  const dl=MAP_NM/60, dn=dl/Math.cos(h.lat*Math.PI/180);
  const bb=[h.lat-dl,h.lon-dn,h.lat+dl,h.lon+dn].map(v=>v.toFixed(4)).join(',');
  const q=`[out:json][timeout:25][bbox:${bb}];(way[highway~"^(motorway|trunk|primary)$"];way[natural=coastline];way[natural=water][water~"^(lake|reservoir|river)$"];way[waterway=riverbank];way[boundary=administrative][admin_level~"^(4|6)$"];way[aeroway=runway];);out geom;`;
  const eps=QS.get('overpass')?[OVERPASS]:OVERPASS_ALT;
  for(const ep of eps){
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),30000);
    try{
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),signal:ctl.signal,
        headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(!r.ok) continue;
      const j=await r.json(), w=[];
      for(const e of j.elements||[]){
        if(!e.geometry || e.geometry.length<2) continue; const t=e.tags||{};
        const k=t.aeroway==='runway'?'rwy':t.boundary?'border':t.natural==='coastline'?'coast':(t.natural==='water'||t.waterway)?'water':/motorway|trunk/.test(t.highway)?'major':'road';
        const p=e.geometry.map(n=>[+n.lat.toFixed(4),+n.lon.toFixed(4)]);
        if(k==='water'){ const la=p.map(v=>v[0]),lo=p.map(v=>v[1]); if(Math.max(...la)-Math.min(...la)+Math.max(...lo)-Math.min(...lo)<0.02) continue; }
        w.push({k,p:k==='rwy'?p:simplify(p,0.002)});
      }
      if(!w.length) continue;            // Overpass returns 200 + empty on timeout: don't cache that
      const m={w,src:'map © OpenStreetMap contributors'};
      try{ localStorage.setItem(key,JSON.stringify(m)); }catch(e){}
      return m;
    }catch(e){} finally{ clearTimeout(to); }
  }
  return null;
}
/* Demo: a tiny synthetic map (invented geography, not a real place). */
function demoMap(h){
  const P=(pts)=>pts.map(([x,y])=>[+(h.lat-y/60).toFixed(4), +(h.lon+x/60/Math.cos(h.lat*Math.PI/180)).toFixed(4)]);
  const w=[], arc=(cx,cy,r,a0,a1,n=24)=>Array.from({length:n+1},(_,i)=>{const a=(a0+(a1-a0)*i/n)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];});

  w.push({k:'major',p:P([[-6,-30],[-4,-12],[-2,0],[1,14],[3,30]])});

/* ---------- render ---------- */
function card(a,feat,kick,o={}){
  const c=carrierFor(a), d=(a.desc||'').trim() || [a.t, LABEL[shapeFor(a)]].filter(Boolean).join(' · ');
  if(o.week) return weekCard(a,feat,kick,o.flip,c,d);
  return `<div class="card${feat?' feat':''}${o.flip?' flip':''}">${feat&&LAST?mapLayer(LAST.home,a):''}${svg(a,{big:feat})}<div class="info">${feat?photoHtml(a):''}
    ${kick?`<div class="kicker">${kick}</div>`:''}
    <div class="call mono">${esc(call(a))}</div>
    ${c?`<div class="carrier">${emblem(c.emb)}${esc(c.name)}</div>`:''}
    <div class="desc">${esc(d)}${(r=>r?` · <span class="route mono">${esc(r)}</span>`:'')(routeFor(a))}</div>
    <div class="stats">
      <div><div class="v">${fl(alt(a))}</div><div class="k">Altitude</div></div>
      <div><div class="v">${a.gs!=null?spd(a.gs):'—'}</div><div class="k">Speed</div></div>
      <div><div class="v">${isNaN(a._d)?'—':dist(a._d)}</div><div class="k">Distance</div></div>
      ${feat?`<div class="hdg"><div class="v">${a.track!=null?Math.round(a.track)+'° '+compass(a.track):'—'}</div><div class="k">Heading</div></div>`:''}
    </div></div></div>`;
}
function weekCard(e,feat,kick,flip,c,d){
  const t=new Date(e.last*1000), id=e.flight||e.r||('#'+String(e.hex).toUpperCase());
  const when=t.toLocaleDateString('en-US',{weekday:'short'})+' '+t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return `<div class="card${feat?' feat':''}${flip?' flip':''}">${svg(e,{big:feat})}<div class="info">
    <div class="kicker">${esc(kick)}</div>
    <div class="call mono">${esc(id)}${e.flight&&e.r?` <span class="reg">${esc(e.r)}</span>`:''}</div>
    ${c?`<div class="carrier">${emblem(c.emb)}${esc(c.name)}</div>`:''}
    <div class="desc">${esc(d)}</div>
    ${!feat?`<div class="v" style="margin-top:calc(var(--u)*.6)">${esc(when)} · max ${e.maxAlt?fl(e.maxAlt):'—'}${e.maxGs?` · ${spd(e.maxGs)}`:''}</div>`:`<div class="stats">
      <div><div class="v">${esc(when)}</div><div class="k">Last seen</div></div>
      <div><div class="v">${e.maxAlt?fl(e.maxAlt):'—'}</div><div class="k">Max altitude</div></div>
      ${e.maxGs?`<div><div class="v">${spd(e.maxGs)}</div><div class="k">Max speed</div></div>`:''}
    </div>`}</div></div>`;
}
function render(data, rx){
  const home = CFG.home || (rx && rx.lat!=null && rx.lon!=null ? {lat:+rx.lat,lon:+rx.lon} : null) || estHome(data && data.aircraft);
  LAST={data,rx,home};
  const list = (data && data.aircraft || [])
    .filter(a => !isNaN(alt(a)) && (a.seen==null || a.seen<MAX_SEEN_S))
    .map(a => Object.assign({}, a, {_d: nm(home,a)}));
  const M=document.getElementById('main'); M.className='';
  if(!list.length){ M.innerHTML=`<div class="quiet">Quiet skies<small class="kicker">no aircraft in range</small></div>`; }
  else{
    const byAlt=[...list].sort((x,y)=>alt(y)-alt(x)), top=byAlt[0], isHigh=alt(top)>=HIGH_FT;
    const nHigh=list.filter(a=>alt(a)>=HIGH_FT).length;
    const rest=list.filter(a=>a!==top).sort((x,y)=>(isNaN(x._d)?1e9:x._d)-(isNaN(y._d)?1e9:y._d) || alt(x)-alt(y)).slice(0,2);
    M.innerHTML = card(top,true, isHigh?`Up high${nHigh>1?` · 1 of ${nHigh}`:''}`:'Highest right now')
      + rest.map((a,i)=>card(a,false,'Nearby',{flip:i===1})).join('');
  }
  document.getElementById('count').textContent = `${list.length} aircraft tracked`+(MAPDATA&&MAPDATA.w.length?` · ${MAPDATA.src}`:'');
  const t = data && data.now ? new Date(data.now*1000) : new Date();
  document.getElementById('updated').textContent = (window.__DEMO?'DEMO DATA · ':'')+'updated '+
    t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(home) document.getElementById('where').textContent = (home.est?'~':'')+
    `${Math.abs(home.lat).toFixed(2)}°${home.lat>=0?'N':'S'} ${Math.abs(home.lon).toFixed(2)}°${home.lon>=0?'E':'W'}`;
}
function renderError(msg){
  document.getElementById('main').innerHTML =
    `<div class="quiet">Receiver unreachable<small class="kicker">${esc(msg)}</small></div>`;
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

/* ---------- "Interesting this week" ----------
   Reads interesting.json (written by the optional Pi-side logger) next to aircraft.json.
   If absent, keeps its own rolling 7-day log in localStorage.
   Params: ?cycle=120 (seconds per cycle, 0 = never show), ?weekSecs=20, ?view=week|live */
const CYCLE_S=QS.has('cycle')?+QS.get('cycle'):120, WEEK_S=+QS.get('weekSecs')||20, WEEK_DAYS=7;

function whyInteresting(a){
  const w=[], f=a.dbFlags||0, sq=String(a.squawk||''), t=(a.t||'').toUpperCase(), al=alt(a);
  if(sq==='7500') w.push('Hijack 7500'); else if(sq==='7600') w.push('Radio failure 7600'); else if(sq==='7700') w.push('Emergency 7700');
  else if(a.emergency && a.emergency!=='none') w.push('Emergency');
  if(f&1) w.push('Military'); if(f&2) w.push('Flagged interesting'); if(f&4) w.push('PIA'); if(f&8) w.push('LADD');
  if(a.category==='A7' || HELIS.has(shapeFor(a))) w.push('Helicopter');
  if(MEDEVAC.test([a.flight,a.ownOp,a.desc].join(' '))) w.push('Medevac');
  if(QUAD.test(t)) w.push('Four-engine'); else if(WIDE.test(t)) w.push('Widebody');
  if(al>45000) w.push('Very high'); if((a.gs||0)>550) w.push('Very fast');
  if(t && !COMMON_TYPES.has(t) && !w.includes('Helicopter') && !w.includes('Military')) w.push('Rare type');
  return w;
}
const LS_KEY='interesting:v1';
function logLocal(list,nowS){
  let log=[]; try{ log=JSON.parse(localStorage.getItem(LS_KEY))||[]; }catch(e){}
  const day=new Date(nowS*1000).toISOString().slice(0,10);
  for(const a of list){ const why=whyInteresting(a); if(!why.length||!a.hex) continue;
    let e=log.find(x=>x.hex===a.hex&&x.day===day);
    if(!e){ e={hex:a.hex,day,first:nowS,why:[]}; log.push(e); }
    Object.assign(e,{last:nowS,flight:(a.flight||'').trim()||e.flight,r:a.r||e.r,t:a.t||e.t,desc:a.desc||e.desc,ownOp:a.ownOp||e.ownOp,
      category:a.category||e.category,track:a.track??e.track,maxAlt:Math.max(e.maxAlt||0,alt(a)||0),maxGs:Math.max(e.maxGs||0,a.gs||0),
      why:[...new Set([...e.why,...why])]});

}

/* ---------- Route lookup (adsbdb.com, free + CORS) ----------
   Airline callsigns only (3-letter ICAO prefix + digits). Cached 24h in localStorage, max 1 request / 4 s,
   failures cached 1h and otherwise ignored. Off with ?routes=0 or OVERHEAD_CONFIG.routes=false. */
const ROUTES_ON=!/^(0|false|off|no)$/i.test(String(QS.get('routes')??((window.OVERHEAD_CONFIG||{}).routes??true)));
const ROUTE_API=(window.OVERHEAD_CONFIG||{}).routeApi||'https://api.adsbdb.com/v0/callsign/';
const RT_KEY='routes:v1', RT_TTL=86400, RT_FAIL_TTL=3600, RT_GAP_MS=4000;
let RT={}; try{ RT=JSON.parse(localStorage.getItem(RT_KEY))||{}; }catch(e){}
const rtQueue=[]; let rtBusy=false, rtRedraw=null;
const isAirlineCS=cs=>/^[A-Z]{3}\d{1,4}[A-Z]{0,2}$/.test(cs)&&!/^(RCH|PAT|CNV|SPAR|SAM|EXEC)/.test(cs);
function rtSave(){ const n=Date.now()/1000; for(const k in RT) if(RT[k].x<n) delete RT[k];
  try{ localStorage.setItem(RT_KEY,JSON.stringify(RT)); }catch(e){} }
function routeFor(a){
  if(!ROUTES_ON) return null;
  if(a.route) return a.route;                                  // demo data / pre-filled
  const cs=(a.flight||'').trim().toUpperCase(); if(!isAirlineCS(cs)) return null;
  const c=RT[cs]; if(c&&c.x>Date.now()/1000) return c.r||null;
  if(!rtQueue.includes(cs)&&rtQueue.length<20){ rtQueue.push(cs); rtPump(); }
  return null;
}
async function rtPump(){
  if(rtBusy||!rtQueue.length) return; rtBusy=true;
  const cs=rtQueue.shift(), n=Date.now()/1000;
  try{
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(ROUTE_API+encodeURIComponent(cs),{signal:ctl.signal}); clearTimeout(to);
    const j=r.ok?await r.json():null, f=j&&j.response&&j.response.flightroute;
    const code=p=>p&&(p.iata_code||p.icao_code);
    if(f&&code(f.origin)&&code(f.destination)){
      RT[cs]={x:n+RT_TTL,r:[f.origin,f.midpoint,f.destination].filter(Boolean).map(code).join(' → ')};
      if(rtRedraw) rtRedraw();
    } else RT[cs]={x:n+(r.status===404||r.ok?RT_TTL:RT_FAIL_TTL),r:null};
  }catch(e){ RT[cs]={x:n+RT_FAIL_TTL,r:null}; }
  rtSave(); setTimeout(()=>{ rtBusy=false; rtPump(); },RT_GAP_MS);
}

/* ---------- Night mode: red-on-black after local sunset ----------
   ?night=auto|on|off (default auto; OVERHEAD_CONFIG.night). Sun times from home lat/lon (NOAA approximation, no API).
   Ignored in e-ink mode. */
const NIGHT=String(QS.get('night')||(window.OVERHEAD_CONFIG||{}).night||'auto').toLowerCase();
function sunTimes(lat,lon,d){            // returns {rise,set} as epoch ms (UTC) for the date d, or null at polar day/night
  const rad=Math.PI/180, J=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())/864e5+2440587.5;
  const n=Math.round(J-2451545.0009+lon/360), Js=2451545.0009-lon/360+n;
  const M=(357.5291+0.98560028*(Js-2451545))%360, C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=(M+C+180+102.9372)%360, Jt=Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const dec=Math.asin(Math.sin(L*rad)*Math.sin(23.4397*rad));
  const cosw=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  if(cosw<-1||cosw>1) return {polar:cosw<-1?'day':'night'};
  const w=Math.acos(cosw)/rad/360, ms=j=>(j-2440587.5)*864e5;
  return {rise:ms(Jt-w),set:ms(Jt+w)};
}
function isNight(home,tMs){
  if(!home) return false;
  for(const o of [-1,0,1]){ const s=sunTimes(home.lat,home.lon,new Date(tMs+o*864e5));
    if(s.polar){ if(o===0) return s.polar==='night'; continue; }
    if(tMs>=s.rise&&tMs<=s.set) return false; }
  return true;
}
function applyNight(home,tMs){
  const on=!CFG.eink&&(NIGHT==='on'||(NIGHT==='auto'&&isNight(home,tMs||Date.now())));
  document.documentElement.classList.toggle('night',on);
}

/* ---------- Stats: daily + weekly ----------
   Kept in localStorage per local day (unique hex, per-hour counts, types, farthest contact), merged with
   interesting.json types. Shown as a card in the weekly rotation, or always with ?view=stats. */
const ST_KEY='stats:v1';
function dayKey(tMs){ const d=new Date(tMs); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function loadStats(){ try{ return JSON.parse(localStorage.getItem(ST_KEY))||{}; }catch(e){ return {}; } }
function logStats(list,home,nowS){
  const S=loadStats(), tMs=nowS*1000, k=dayKey(tMs), h=new Date(tMs).getHours();
  const D=S[k]||(S[k]={hex:{},hours:Array(24).fill(0),types:{},far:null});
  for(const a of list){ if(!a.hex) continue;
    const first=!D.hex[a.hex];
    if(first){ D.hex[a.hex]=1; D.hours[h]++; const t=(a.t||'').toUpperCase(); if(t) D.types[t]=(D.types[t]||0)+1; }
    const dd=nm(home,a);
    if(isFinite(dd)&&(!D.far||dd>D.far.d)) D.far={d:dd,id:(a.flight||'').trim()||a.r||a.hex,t:a.t||''};
  }
  const keep=Object.keys(S).sort().slice(-8); for(const x in S) if(!keep.includes(x)) delete S[x];
  try{ localStorage.setItem(ST_KEY,JSON.stringify(S)); }catch(e){}
  return S;
}
function summarize(days){
  const hex=new Set(), hours=Array(24).fill(0), types={}; let far=null;
  for(const D of days){ Object.keys(D.hex||{}).forEach(x=>hex.add(x)); (D.hours||[]).forEach((v,i)=>hours[i]+=v);
    for(const t in D.types||{}) types[t]=(types[t]||0)+D.types[t]; if(D.far&&(!far||D.far.d>far.d)) far=D.far; }
  const bh=hours.indexOf(Math.max(...hours));
  return {unique:hex.size||days.reduce((s,D)=>s+(D.unique||0),0), busiest:Math.max(...hours)?bh:null, busiestN:hours[bh], far,
    top:Object.entries(types).sort((a,b)=>b[1]-a[1]).slice(0,10)};
}
const hr=h=>h==null?'—':new Date(2000,0,1,h).toLocaleTimeString('en-US',{hour:'numeric'});
function renderStats(S,interesting,nowS,meta){
  const today=S[dayKey(nowS*1000)]||{}, week=Object.values(S);

  if(meta&&meta.weekUnique) wk.unique=meta.weekUnique;

    wk.top=Object.entries(ty).sort((a,b)=>b[1]-a[1]).slice(0,10); }

      <div><div class="v">${s.far?dist(s.far.d):'—'}</div><div class="k">Farthest${s.far?` · ${esc(s.far.id)}`:''}</div></div></div></div>`;

      `<div class="st-row mono"><span>${i+1}. ${esc(t)}</span><i style="width:${Math.max(4,n/max*100)}%"></i><b>${n}</b></div>`).join(''):'<div class="desc">Collecting…</div>'}</div>${spark(meta&&meta.samples)}`;
  document.getElementById('count').textContent=`${week.length} day${week.length===1?'':'s'} of stats · ${meta&&meta.src==='logger'?'receiver logger':'this browser'}`;

function rotView(){            // live | week | stats | heat

/* ---------- Logger stats (ot/stats.json), receiver health, heat map ----------
   The Pi logger writes ot/stats.json + ot/heat.json next to interesting.json. The stats view prefers them
   (they cover every aircraft, 24/7) and falls back to this browser's own localStorage log. */
const HEAT_ON=/^(1|true|yes|on)$/i.test(String(QS.get('heat')??((window.OVERHEAD_CONFIG||{}).heat??'')))||QS.get('view')==='heat';
const HEAT_KM=+QS.get('heatKm')||120;
function otBase(iurl){ const c=(window.OVERHEAD_CONFIG||{}).otUrl; if(c) return c.replace(/\/?$/,'/');
  return iurl&&/ot\/interesting\.json(\?.*)?$/.test(iurl)?iurl.replace(/interesting\.json(\?.*)?$/,''):'ot/'; }
function fromLogger(j){           // stats.json -> the page's per-day shape (+ meta)
  if(!j||!j.days) return null; const S={};
  for(const k in j.days){ const D=j.days[k]; S[k]={unique:D.unique||0,hours:D.hours||[],types:D.types||{},
    far:D.far?{d:D.far.km/1.852,id:D.far.id,t:D.far.t}:null}; }
  return {S,meta:{weekUnique:j.week&&j.week.unique,samples:j.samples||[],health:j.health||null,now:j.now,src:'logger'}};
}
function setHealth(meta,nowS){
  const el=document.getElementById('health'); if(!el) return;
  let msg='';
  if(meta&&meta.src==='logger'){ const h=meta.health||{};
    if(nowS-(h.updated||meta.now||0)>600) msg='logger stale';
    else if(h.state==='quiet') msg='receiver quiet'; }
  el.textContent=msg?'● '+msg:''; el.title=msg;
}
function spark(samples){          // message rate, last 24h
  if(!samples||samples.length<3) return '';
  const v=samples.map(s=>s[1]), mx=Math.max(...v,1), W=600, H=60;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-y/mx*H).toFixed(1)}`).join(' ');
  const avg=v.reduce((a,b)=>a+b,0)/v.length;
  return `<div class="st-rate"><div class="kicker">Messages / s · 24 h · now ${Math.round(v[v.length-1])} · avg ${Math.round(avg)} · peak ${Math.round(mx)}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`;
}

/* Heat map: logger keeps east/north 1 km cell offsets from the receiver (never coordinates), decaying.
   Drawn as dot density so it survives 1-bit e-ink. ?view=heat, or ?heat=1 adds it to the rotation. */
function hash32(x,y,i){ let h=(x*374761393+y*668265263+i*1274126177)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967296; }
function renderHeat(H){
  const M=document.getElementById('main'); M.className='heatv'; document.getElementById('where').textContent='Heat map';
  renderRecent([],0);
  const cells=(H&&H.cells)||[], ck=(H&&H.cell_km)||1, R=HEAT_KM, S=1000, c=S/2, k=c/R;
  const ws=cells.filter(q=>Math.hypot(q[0],q[1])*ck<=R).map(q=>q[2]).sort((a,b)=>a-b);
  const ref=ws.length?ws[Math.floor(ws.length*.97)]||ws[ws.length-1]:1;
  let dots='', n=0; const MAX=16000;
  for(const [x,y,w] of cells){ if(Math.hypot(x,y)*ck>R) continue;
    const m=Math.min(9,Math.ceil(Math.sqrt(Math.min(1,w/ref))*9));
    for(let i=0;i<m&&n<MAX;i++,n++){ const px=c+(x+hash32(x,y,i))*ck*k, py=c-(y+hash32(y,x,i+7))*ck*k;
      dots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.1"/>`; } }
  const rings=[R/4,R/2,R].map(r=>`<circle class="ring" cx="${c}" cy="${c}" r="${(r*k).toFixed(1)}"/><text x="${c+4}" y="${(c-r*k+18).toFixed(1)}">${dist(r/1.852)}</text>`).join('');
  M.innerHTML=`<div class="heat"><svg viewBox="0 0 ${S} ${S}">${rings}
    <line class="ring" x1="${c}" y1="12" x2="${c}" y2="${S-12}"/><line class="ring" x1="12" y1="${c}" x2="${S-12}" y2="${c}"/>
    <text x="${c-22}" y="30">N</text><g class="dots">${dots}</g><rect x="${c-7}" y="${c-7}" width="14" height="14" class="home"/></svg>
    <div class="desc">${cells.length?`Where aircraft were heard · ${cells.length.toLocaleString()} cells · ${ck} km grid · ${H.half_life_days||7}-day fade`:'Collecting… (needs the Pi logger)'}</div></div>`;
  document.getElementById('count').textContent=`${n.toLocaleString()} dots · centre = receiver`;
}
function DEMO_HEAT(){             // synthetic: three airways + an approach fan, offsets only
  const cells={}, add=(x,y,w)=>{ const kk=x+','+y; cells[kk]=(cells[kk]||0)+w; };
  const lane=(a,b,off,w)=>{ for(let t=-120;t<=120;t+=1){ const j=Math.round(hash32(t,off,1)*4-2);
    add(Math.round(t*Math.cos(a)-(off+j)*Math.sin(a)), Math.round(t*Math.sin(a)+(off+j)*Math.cos(a)), w*(0.6+hash32(t,off,2))); } };
  lane(0.35,0,8,6); lane(-0.9,0,-20,4); lane(1.4,0,35,3); lane(2.6,0,-50,2);
  for(let i=0;i<900;i++){ const r=hash32(i,3,4)*30, a=hash32(i,5,6)*6.283; add(Math.round(-40+r*Math.cos(a)),Math.round(-25+r*Math.sin(a)*.6),3); }
  for(let i=0;i<2500;i++){ const r=Math.pow(hash32(i,8,9),.6)*120, a=hash32(i,1,2)*6.283; add(Math.round(r*Math.cos(a)),Math.round(r*Math.sin(a)),.4); }
  return {cell_km:1,half_life_days:7,cells:Object.entries(cells).map(([kk,w])=>{ const [x,y]=kk.split(',').map(Number); return [x,y,+w.toFixed(2)]; })};
}

/* ---------- Airframe photos (Planespotters.net public photo API) ----------
   Terms: photographer credit next to the image, thumbnail links to the photo page (plain anchor), URLs unchanged,
   JSON cached <= 24 h, images never stored. Featured live card only; off in e-ink mode or with ?photos=0. */
const PHOTOS_ON=!CFG.eink&&!/^(0|false|off|no)$/i.test(String(QS.get('photos')??((window.OVERHEAD_CONFIG||{}).photos??true)));
const PH_KEY='photos:v1', PH_TTL=86400, PH_FAIL_TTL=6*3600, PH_API='https://api.planespotters.net/pub/photos/hex/';
let PH={}; try{ PH=JSON.parse(localStorage.getItem(PH_KEY))||{}; }catch(e){}
const phPending=new Set();
function phSave(){ const n=Date.now()/1000; for(const k in PH) if(PH[k].x<n) delete PH[k];
  const ks=Object.keys(PH); if(ks.length>300) ks.sort((a,b)=>PH[a].x-PH[b].x).slice(0,ks.length-300).forEach(k=>delete PH[k]);
  try{ localStorage.setItem(PH_KEY,JSON.stringify(PH)); }catch(e){} }
const DEMO_PHOTO={src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="133"><rect width="200" height="133" fill="#cfd8dc"/><rect y="96" width="200" height="37" fill="#90a4ae"/><path d="M30 80 L150 70 L172 74 L150 80 L110 82 L90 100 L80 100 L88 82 L40 84 L30 92 L24 92 L28 82Z" fill="#37474f"/><text x="100" y="125" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#263238">DEMO PHOTO</text></svg>'),
  link:'#demo-photo',by:'Demo Photographer',w:200,h:133};
function photoFor(a){
  if(!PHOTOS_ON||!a.hex) return null;
  if(window.__DEMO) return DEMO_PHOTO;
  const hx=String(a.hex).toLowerCase().replace(/^~/,''); if(!/^[0-9a-f]{6}$/.test(hx)) return null;
  const c=PH[hx]; if(c&&c.x>Date.now()/1000) return c.p||null;
  if(!phPending.has(hx)){ phPending.add(hx); (async()=>{ const n=Date.now()/1000;
    try{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(PH_API+hx,{signal:ctl.signal}); clearTimeout(to);
      if(!r.ok) throw 0; const j=await r.json(), p=j&&j.photos&&j.photos[0];
      PH[hx]=p&&p.thumbnail&&p.link?{p:{src:p.thumbnail.src,link:p.link,by:p.photographer||'',w:p.thumbnail.size&&p.thumbnail.size.width,h:p.thumbnail.size&&p.thumbnail.size.height},x:n+PH_TTL}:{p:null,x:n+PH_TTL};
    }catch(e){ PH[hx]={p:null,x:n+PH_FAIL_TTL}; }
    phSave(); phPending.delete(hx); if(PH[hx].p&&rtRedraw) rtRedraw(); })(); }
  return null;
}
function photoHtml(a){ const p=photoFor(a); if(!p) return '';
  return `<figure class="photo"><a href="${esc(p.link)}" target="_blank"><img src="${esc(p.src)}" alt="Photo of ${esc(call(a))}"${p.w?` width="${p.w}" height="${p.h}"`:''}></a>
    <figcaption>© ${esc(p.by)} · <a href="${esc(p.link)}" target="_blank">Planespotters.net</a></figcaption></figure>`; }

/* ---------- Optional chime (WebAudio, no files): ?sound=1 ----------
   Emergency / Hijack / Radio / Medevac / Military / Helicopter in view, once per aircraft per 30 min. */
const SOUND_ON=!CFG.eink&&/^(1|true|yes|on)$/i.test(String(QS.get('sound')??((window.OVERHEAD_CONFIG||{}).sound??'')));
const CHIME_TAGS=/^(Hijack|Emergency|Radio|Medevac|Military|Helicopter)/, CHIME_GAP=1800, CH_KEY='chime:v1';
let ACTX=null;
function audioCtx(){ if(!ACTX){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; ACTX=new A(); } return ACTX; }
function soundHint(show){ let h=document.getElementById('sndhint');
  if(!show){ if(h) h.remove(); return; }
  if(!h){ h=document.createElement('button'); h.id='sndhint'; h.className='mono'; h.textContent='🔈 tap to enable sound'; document.body.appendChild(h); } }
function soundInit(){ if(!SOUND_ON) return;
  const unlock=()=>{ const c=audioCtx(); if(!c) return; c.resume().then(()=>{ if(c.state==='running'){ soundHint(false);
      const o=c.createOscillator(), g=c.createGain(); g.gain.value=0; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+.01); } }); };
  ['pointerdown','touchend','keydown','click'].forEach(e=>document.addEventListener(e,unlock,{passive:true}));
  const c=audioCtx(); if(!c||c.state!=='running'||QS.has('soundHint')) soundHint(true);
}
function chime(urgent){ const c=audioCtx(); if(!c||c.state!=='running') return false;
  const t=c.currentTime, notes=urgent?[880,660,880,660]:[659.25,987.77];
  notes.forEach((f,i)=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f;
    const s=t+i*.28; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.25,s+.02); g.gain.exponentialRampToValueAtTime(.001,s+.9);
    o.connect(g).connect(c.destination); o.start(s); o.stop(s+1); });
  return true; }
function chimeCheck(list){ if(!SOUND_ON) return;
  let L={}; try{ L=JSON.parse(localStorage.getItem(CH_KEY))||{}; }catch(e){}
  const n=Date.now()/1000; let fire=null;
  for(const a of list){ if(!a.hex) continue; const w=whyInteresting(a).filter(x=>CHIME_TAGS.test(x)); if(!w.length) continue;
    if(L[a.hex]&&n-L[a.hex]<CHIME_GAP) continue;
    const urgent=w.some(x=>/^(Hijack|Emergency|Radio)/.test(x)); fire=fire||{urgent,hx:a.hex}; if(urgent) fire.urgent=true; L[a.hex]=n; }
  for(const k in L) if(n-L[k]>CHIME_GAP) delete L[k];
  if(fire&&chime(fire.urgent)){ try{ localStorage.setItem(CH_KEY,JSON.stringify(L)); }catch(e){} }
  else if(fire&&ACTX&&ACTX.state!=='running') soundHint(true);
}

const DEMO_ROUTES={"UAL88":"EWR → TLV","DAL1234":"ATL → DEN","AAL100":"JFK → LHR","SWA2210":"MDW → DEN"};
function DEMO_STATS(nowS){                       // synthetic 7-day stats for ?demo=1
  const S={}, ty=[["B738",61],["A320",48],["E75L",44],["CRJ9",31],["B739",27],["A321",22],["C172",19],["B38M",17],["A20N",12],["BCS3",9]];
  for(let i=6;i>=0;i--){ const k=dayKey((nowS-i*86400)*1000), hours=Array(24).fill(0).map((_,h)=>Math.round(Math.max(0,Math.sin((h-5)/18*Math.PI))*(30+i*2)));
    const hex={}; for(let j=0;j<180+i*7;j++) hex['d'+i+'_'+j]=1;
    S[k]={hex,hours,types:Object.fromEntries(ty.map(([t,n])=>[t,Math.round(n/7)+(i%3)])),far:{d:180+i*9,id:i?'DAL1234':'AAL100',t:'B772'}}; }
  return S;
}
function demoLoggerStats(nowS){   // what ot/stats.json looks like, synthetic
  const B=DEMO_STATS(nowS), days={};
  for(const k in B){ const D=B[k]; days[k]={unique:Object.keys(D.hex).length+40,hours:D.hours.map(h=>Math.round(h*1.25)),types:D.types,far:{km:D.far.d*1.852+30,id:D.far.id,t:D.far.t}}; }
  const samples=[]; for(let i=287;i>=0;i-=1){ const t=nowS-i*300, h=new Date(t*1000).getHours();
    samples.push([t,Math.round(Math.max(40,Math.sin((h-5)/18*Math.PI)*900)+hash32(i,2,3)*120),Math.round(Math.max(2,Math.sin((h-5)/18*Math.PI)*45))]); }
  return fromLogger({now:nowS,days,week:{unique:1240},samples,health:{state:'ok',updated:nowS,rate:samples[samples.length-1][1]}});
}
const DEMO_RECEIVER = {"lat":39.0,"lon":-98.0};

async function getJSON(u){ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(r.status+' '+u); return r.json(); }

(async function main(){
  const q=new URLSearchParams(location.search);
  if(CFG.eink) document.body.classList.add('eink');
  // 1) Tesserae Code element: data is injected as ctx.data (fetch is blocked in its sandbox)
  const C = window.ctx;
  if(C && C.data && !q.has('demo')){
    const ac = C.data.aircraft || C.data.data || C.data.rest_service;
    const rx = C.data.receiver || null;
    if(ac && ac.error) return renderError(ac.error);
    return render(ac, rx);
  }
  // 2) Demo mode
  if(q.has('demo')){
    window.__DEMO=true;
    let ac=DEMO_AIRCRAFT, rx=DEMO_RECEIVER;
    try{ ac=await getJSON('sample-aircraft.json'); rx=await getJSON('sample-receiver.json'); }catch(e){}
    if(MAP_ON) MAPDATA=demoMap(rx);
    (ac.aircraft||[]).forEach(a=>{ if(!a.route&&DEMO_ROUTES[(a.flight||'').trim()]) a.route=DEMO_ROUTES[(a.flight||'').trim()]; });
    if(QS.has("night")) applyNight(rx, (ac.now||Date.now()/1000)*1000);   // demo: only when asked
    const v=rotView(), dn=ac.now||Date.now()/1000; soundInit();
    if(v==='heat') return renderHeat(DEMO_HEAT());
    if(v==='stats'){ const L=QS.get('statsSrc')==='browser'?null:demoLoggerStats(dn);
      if(QS.has('quiet')&&L) L.meta.health.state='quiet';
      if(L) setHealth(L.meta,dn);
      return L?renderStats(L.S,DEMO_INTERESTING.aircraft,dn,L.meta):renderStats(DEMO_STATS(dn), DEMO_INTERESTING.aircraft, dn); }
    if(v==='week') return renderWeek(DEMO_INTERESTING.aircraft, DEMO_INTERESTING.now);
    render(ac, rx); renderRecent(DEMO_INTERESTING.aircraft, DEMO_INTERESTING.now);
    if(QS.has('quiet')) setHealth({src:'logger',now:dn,health:{state:'quiet',updated:dn}},dn); return;
  }
  // 3) Standalone (served from the Pi, embedded via Tesserae's Webpage widget)
  const url = CFG.aircraftUrl;
  const rurl = CFG.receiverUrl || url.replace(/aircraft\.json(\?.*)?$/, 'receiver.json');
  let rx=null; try{ rx=await getJSON(rurl); }catch(e){}
  // logger output: explicit URL, else next to aircraft.json, else next to this page (logger default --out)
  const iurls = CFG.interestingUrl ? [CFG.interestingUrl]
    : [...new Set([url.replace(/aircraft\.json(\?.*)?$/, 'interesting.json'), INTERESTING_URL, 'interesting.json'])];
  let iurl=null;
  async function tick(first){
    let data;
    try{ data=await getJSON(url); }catch(e){ if(first) renderError(e.message||String(e)); return; }
    const nowS=data.now||Date.now()/1000, live=(data.aircraft||[]).filter(a=>a.seen==null||a.seen<MAX_SEEN_S);
    let week=null;
    for(const u of (iurl?[iurl]:iurls)){ try{ const j=await getJSON(u); week=Array.isArray(j)?j:j.aircraft; if(Array.isArray(week)){ iurl=u; break; } week=null; }catch(e){} }
    if(!week) week=logLocal(live,nowS); else logLocal(live,nowS);
    const home=CFG.home||(rx&&rx.lat!=null?{lat:+rx.lat,lon:+rx.lon}:null)||(LAST&&LAST.home);
    let S=home?logStats(live,home,nowS):loadStats(), meta=null;
    const ob=otBase(iurl);
    try{ const L=fromLogger(await getJSON(ob+'stats.json')); if(L&&Object.keys(L.S).length){ S=L.S; meta=L.meta; } }catch(e){}
    setHealth(meta,nowS);
    applyNight(home, nowS*1000);
    const v=rotView();
    if(v==='heat'){ let H=null; try{ H=await getJSON(ob+'heat.json'); }catch(e){} renderHeat(H); }
    else if(v==='stats') renderStats(S,week,nowS,meta); else if(v==='week') renderWeek(week,nowS);
    else { render(data, rx); renderRecent(week,nowS); }
    chimeCheck(live);
    rtRedraw=()=>{ if(rotView()==='live'&&LAST) render(LAST.data,LAST.rx); };
  }
  soundInit();
  if(MAP_ON){ try{ OUTLINE=parseOutline(await getJSON(url.replace(/aircraft\.json(\?.*)?$/, 'outline.json'))); }catch(e){} }
  await tick(true);
  async function mapTry(){
    if(MAPDATA || !LAST || !LAST.home || rotView()!=='live') return;
    const m=await loadMap(LAST.home); if(m){ MAPDATA=m; render(LAST.data, LAST.rx); }
  }
  await mapTry(); setInterval(mapTry, 10*60*1000);   // retry if offline/blocked at boot
  const every = CFG.refresh;                         // seconds; 0 = render once; ?eink=1 defaults to 60
  if(every) setInterval(()=>tick(false), every*1000);
  else if(CYCLE_S && !q.get('view')){             // no polling: still flip between live and weekly views
    setInterval(()=>tick(false), Math.max(5,Math.min(WEEK_S,CYCLE_S-WEEK_S))*1000); }
})();
