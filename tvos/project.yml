# XcodeGen spec. Generate the Xcode project with:  brew install xcodegen && xcodegen
# Change BUNDLE_PREFIX (and pick your team in Xcode > Signing) before building on a device.
name: Overhead
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    BUNDLE_PREFIX: com.example
    APP_GROUP: group.$(BUNDLE_PREFIX).overhead
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set in Xcode, or put your Team ID here
    CODE_SIGN_STYLE: Automatic
targets:
  Overhead:
    type: application
    platform: tvOS
    sources:
      - path: Overhead/Sources
      - path: Overhead/Resources
        buildPhase: resources
    info:
      path: Overhead/Info.plist
      properties:
        CFBundleDisplayName: Overhead
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Automatic
        NSLocalNetworkUsageDescription: Overhead reads live aircraft data from the ADS-B receiver (readsb / tar1090) on your home network.
        NSBonjourServices: [_http._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: overhead
            CFBundleURLSchemes: [overhead]
        OverheadAppGroup: $(APP_GROUP)
    entitlements:
      path: Overhead/Overhead.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).overhead
        TARGETED_DEVICE_FAMILY: "3"
    dependencies:
      - target: OverheadTopShelf
        embed: true
  # Optional. Remove this target (and the dependency above) if you don't want Top Shelf or App Groups.
  OverheadTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: Overhead/Sources/Core/SharedState.swift
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Overhead Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OverheadAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: TopShelf/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).overhead.topshelf
        TARGETED_DEVICE_FAMILY: "3"
